<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Mallard Chat</title>
  <link rel="stylesheet" href="/public/style.css">
</head>
<body>

  <!-- ЛАЙТБОКС -->
  <div id="lightbox">
    <div id="lightbox-backdrop"></div>
    <div id="lightbox-content">
      <button id="lightbox-close">✕</button>
      <img id="lightbox-img" src="" alt="">
      <video id="lightbox-video" controls></video>
    </div>
  </div>

  <!-- ШАПКА -->
  <div id="header">
    <div id="header-avatar">🦆</div>
    <div id="header-info">
      <div id="header-title">Mallard Chat</div>
      <div id="header-status">онлайн</div>
    </div>
    <button id="logout-btn" title="Выйти">↩</button>
  </div>

  <!-- СООБЩЕНИЯ -->
  <ul id="messages"></ul>

  <!-- ФОРМА -->
  <div id="form-wrapper">
    <input type="file" id="fileInput" accept="image/*,video/*,image/gif" multiple style="display:none;">
    <button type="button" id="attachBtn" title="Прикрепить файл">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
      </svg>
    </button>
    <input id="input" autocomplete="off" placeholder="Сообщение..."/>
    <button type="button" id="sendBtn" title="Отправить">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
      </svg>
    </button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const token = localStorage.getItem('mallard_token');
    const savedUsername = localStorage.getItem('mallard_username');
    if (!token || !savedUsername) window.location.href = '/login.html';

    let username = savedUsername;
    let counter = 0;

    const socket = io({
      auth: { token: token, serverOffset: 0 },
      ackTimeout: 10000,
      retries: 3,
    });

    const input = document.getElementById('input');
    const messages = document.getElementById('messages');
    const sendBtn = document.getElementById('sendBtn');
    const attachBtn = document.getElementById('attachBtn');
    const fileInput = document.getElementById('fileInput');

    // ========== ЛАЙТБОКС ==========
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxVideo = document.getElementById('lightbox-video');
    const lightboxClose = document.getElementById('lightbox-close');
    const lightboxBackdrop = document.getElementById('lightbox-backdrop');

    function openLightbox(type, src) {
      if (type === 'image') {
        lightboxImg.src = src;
        lightboxImg.style.display = 'block';
        lightboxVideo.style.display = 'none';
        lightboxVideo.pause();
        lightboxVideo.src = '';
      } else {
        lightboxVideo.src = src;
        lightboxVideo.style.display = 'block';
        lightboxImg.style.display = 'none';
        lightboxImg.src = '';
      }
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
      lightboxVideo.pause();
      setTimeout(() => {
        lightboxImg.src = '';
        lightboxVideo.src = '';
      }, 300);
    }

    lightboxClose.addEventListener('click', closeLightbox);
    lightboxBackdrop.addEventListener('click', closeLightbox);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

    // ========== ОТПРАВКА ТЕКСТА ==========
    function sendText() {
      if (input.value.trim()) {
        const clientOffset = `${socket.id}-${counter++}`;
        socket.emit('chat message', { text: input.value, username }, clientOffset);
        input.value = '';
      }
    }

    sendBtn.addEventListener('click', sendText);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
    });

    // ========== ОТПРАВКА ФАЙЛОВ ==========
    attachBtn.addEventListener('click', () => { fileInput.value = ''; fileInput.click(); });

    async function uploadFile(file) {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('username', username);
      const response = await fetch('/api/upload', { method: 'POST', body: formData });
      if (!response.ok) throw new Error('Ошибка загрузки');
      return await response.json();
    }

    fileInput.addEventListener('change', async () => {
      const files = Array.from(fileInput.files);
      if (!files.length) return;
      attachBtn.disabled = true;
      attachBtn.classList.add('loading');
      try {
        for (const file of files) {
          const data = await uploadFile(file);
          if (data.url) {
            const clientOffset = `${socket.id}-${counter++}`;
            socket.emit('chat message', {
              type: 'file', fileType: data.fileType, url: data.url, username
            }, clientOffset);
          }
        }
      } catch (err) {
        console.error('Ошибка загрузки файла:', err);
        alert('Не удалось загрузить файл(ы)');
      } finally {
        attachBtn.disabled = false;
        attachBtn.classList.remove('loading');
        fileInput.value = '';
      }
    });

    // ========== ПОЛУЧЕНИЕ СООБЩЕНИЙ ==========
    function addMessage(msg) {
      if (typeof msg === 'string') msg = { text: msg, username: 'System' };

      const isOwn = msg.username === username;
      const item = document.createElement('li');
      item.className = isOwn ? 'own' : 'other';

      if (!isOwn) {
        const nameSpan = document.createElement('span');
        nameSpan.className = 'message-username';
        nameSpan.textContent = msg.username;
        item.appendChild(nameSpan);
      }

      if (msg.type === 'file') {
        if (msg.fileType === 'image') {
          const img = document.createElement('img');
          img.src = msg.url;
          img.className = 'chat-media';
          img.loading = 'lazy';
          img.title = 'Нажми чтобы увеличить';
          img.addEventListener('click', () => openLightbox('image', msg.url));
          item.appendChild(img);
        } else if (msg.fileType === 'video') {
          const wrap = document.createElement('div');
          wrap.className = 'video-thumb';
          wrap.title = 'Нажми чтобы воспроизвести';
          const video = document.createElement('video');
          video.src = msg.url;
          video.className = 'chat-media';
          video.muted = true;
          const playIcon = document.createElement('div');
          playIcon.className = 'play-icon';
          playIcon.innerHTML = '▶';
          wrap.appendChild(video);
          wrap.appendChild(playIcon);
          wrap.addEventListener('click', () => openLightbox('video', msg.url));
          item.appendChild(wrap);
        } else {
          const link = document.createElement('a');
          link.href = msg.url;
          link.textContent = '📎 Скачать файл';
          link.target = '_blank';
          link.className = 'file-link';
          item.appendChild(link);
        }
      } else {
        const textSpan = document.createElement('span');
        textSpan.textContent = msg.text;
        item.appendChild(textSpan);
      }

      messages.appendChild(item);
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    socket.on('chat message', (msg, serverOffset) => {
      addMessage(msg);
      if (serverOffset) socket.auth.serverOffset = serverOffset;
    });

    // ========== ВЫХОД ==========
    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('mallard_token');
      localStorage.removeItem('mallard_username');
      window.location.href = '/login.html';
    });
  </script>
</body>
</html>
