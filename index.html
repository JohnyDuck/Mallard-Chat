<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Mallard Chat</title>
  <link rel="stylesheet" href="/public/style.css">
</head>
<body>
  <ul id="messages"></ul>
  <form id="form" action="">
    <input id="input" autocomplete="off" placeholder="Напиши что-нибудь..."/>
    <input type="file" id="fileInput" accept="image/*,video/*,image/gif" multiple style="display: none;">
    <button type="button" id="attachBtn">📎</button>
    <button type="submit">Send</button>
  </form>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const token = localStorage.getItem('mallard_token');
    const savedUsername = localStorage.getItem('mallard_username');

    if (!token || !savedUsername) {
        window.location.href = '/login.html';
    }

    let username = savedUsername;
    let counter = 0;

    const socket = io({
        auth: { token: token, serverOffset: 0 },
        ackTimeout: 10000,
        retries: 3,
    });

    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');

    // ========== ОТПРАВКА ТЕКСТА ==========
    form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (input.value) {
            const clientOffset = `${socket.id}-${counter++}`;
            socket.emit('chat message', {
                text: input.value,
                username: username
            }, clientOffset);
            input.value = '';
        }
    });

    // ========== ОТПРАВКА ФАЙЛОВ ==========
    const attachBtn = document.getElementById('attachBtn');
    const fileInput = document.getElementById('fileInput');

    attachBtn.addEventListener('click', () => {
        fileInput.value = '';
        fileInput.click();
    });

    async function uploadFile(file) {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('username', username);

        const response = await fetch('/api/upload', {
            method: 'POST',
            body: formData
        });

        if (!response.ok) throw new Error('Ошибка загрузки');
        return await response.json();
    }

    fileInput.addEventListener('change', async () => {
        const files = Array.from(fileInput.files);
        if (!files.length) return;

        attachBtn.disabled = true;

        try {
            for (const file of files) {
                const data = await uploadFile(file);
                if (data.url) {
                    // ГЛАВНОЕ ИСПРАВЛЕНИЕ: каждый файл получает уникальный clientOffset
                    const clientOffset = `${socket.id}-${counter++}`;
                    socket.emit('chat message', {
                        type: 'file',
                        fileType: data.fileType,
                        url: data.url,
                        username: username
                    }, clientOffset);
                }
            }
        } catch (err) {
            console.error('Ошибка загрузки файла:', err);
            alert('Не удалось загрузить файл(ы)');
        } finally {
            attachBtn.disabled = false;
            fileInput.value = '';
        }
    });

    // ========== ПОЛУЧЕНИЕ СООБЩЕНИЙ ==========
    socket.on('chat message', (msg, serverOffset) => {
        if (typeof msg === 'string') {
            msg = { text: msg, username: 'System' };
        }

        const item = document.createElement('li');
        const isOwn = msg.username === username;
        item.className = isOwn ? 'own' : 'other';

        if (!isOwn) {
            const nameSpan = document.createElement('span');
            nameSpan.className = 'message-username';
            nameSpan.textContent = msg.username;
            item.appendChild(nameSpan);
        }

        if (msg.type === 'file') {
            if (msg.fileType === 'image') {
                const img = document.createElement('img');
                img.src = msg.url;
                img.style.maxWidth = '200px';
                img.style.maxHeight = '150px';
                img.style.borderRadius = '12px';
                img.style.display = 'block';
                item.appendChild(img);
            } else if (msg.fileType === 'video') {
                const video = document.createElement('video');
                video.src = msg.url;
                video.controls = true;
                video.style.maxWidth = '200px';
                video.style.maxHeight = '150px';
                video.style.borderRadius = '12px';
                video.style.display = 'block';
                item.appendChild(video);
            } else {
                const link = document.createElement('a');
                link.href = msg.url;
                link.textContent = '📎 Скачать файл';
                link.target = '_blank';
                item.appendChild(link);
            }
        } else {
            const textSpan = document.createElement('span');
            textSpan.textContent = msg.text;
            item.appendChild(textSpan);
        }

        messages.appendChild(item);
        window.scrollTo(0, document.body.scrollHeight);
        if (serverOffset) socket.auth.serverOffset = serverOffset;
    });
  </script>
</body>
</html>
