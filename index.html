<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Mallard Chat</title>
  <link rel="stylesheet" href="/public/style.css">
</head>
<body>
  <ul id="messages"></ul>
  <form id="form" action="">
    <input id="input" autocomplete="off" placeholder="Напиши что-нибудь..."/>
    <input type="file" id="fileInput" accept="image/*,video/*,image/gif" style="display: none;">
    <button type="button" id="attachBtn">📎</button>
    <button type="submit">Send</button>
  </form>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const token = localStorage.getItem('mallard_token');
    const savedUsername = localStorage.getItem('mallard_username');

    if (!token || !savedUsername) {
        window.location.href = '/login.html';
    }

    let username = savedUsername;
    let counter = 0;
    let lastMessageId = null;  // <-- ДОБАВЛЕНО

    const socket = io({
        auth: { token: token, serverOffset: 0 },
        ackTimeout: 10000,
        retries: 3,
    });

    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (input.value) {
            const clientOffset = `${socket.id}-${counter++}`;
            socket.emit('chat message', {
                text: input.value,
                username: username
            }, clientOffset);
            input.value = '';
        }
    });

    const attachBtn = document.getElementById('attachBtn');
    let fileInput = document.getElementById('fileInput');

    // Удаляем старый обработчик, если был
    attachBtn.onclick = () => {
        fileInput.click();
    };

    fileInput.addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        attachBtn.disabled = true;
        
        const formData = new FormData();
        formData.append('file', file);
        formData.append('username', username);
        
        try {
            const response = await fetch('/api/upload', {
                method: 'POST',
                body: formData
            });
            
            if (!response.ok) throw new Error('Ошибка загрузки');
            
            const data = await response.json();
            if (data.url) {
                socket.emit('chat message', {
                    type: 'file',
                    fileType: data.fileType,
                    url: data.url,
                    username: username
                });
            }
        } catch (err) {
            console.error(err);
            alert('Не удалось загрузить файл');
        } finally {
            attachBtn.disabled = false;
            
            // ========== ГЛАВНЫЙ ФОКУС ==========
            // Удаляем старый input и создаём новый (но через innerHTML)
            const oldInput = fileInput;
            const newInput = document.createElement('input');
            newInput.type = 'file';
            newInput.id = 'fileInput';
            newInput.accept = 'image/*,video/*,image/gif';
            newInput.style.display = 'none';
            newInput.addEventListener('change', arguments.callee);
            
            oldInput.parentNode.replaceChild(newInput, oldInput);
            fileInput = newInput;
            attachBtn.onclick = () => fileInput.click();
        }
    });

    socket.on('chat message', (msg, serverOffset) => {
        // Временно отключаем проверку дубликатов
        // if (serverOffset && lastMessageId === serverOffset) return;
        // lastMessageId = serverOffset;

        if (typeof msg === 'string') {
            msg = { text: msg, username: 'System' };
        }

        const item = document.createElement('li');
        const isOwn = msg.username === username;
        item.className = isOwn ? 'own' : 'other';

        if (!isOwn) {
            const nameSpan = document.createElement('span');
            nameSpan.className = 'message-username';
            nameSpan.textContent = msg.username;
            item.appendChild(nameSpan);
        }

        if (msg.type === 'file') {
            if (msg.fileType === 'image') {
                const img = document.createElement('img');
                img.src = msg.url;
                img.style.maxWidth = '200px';
                img.style.maxHeight = '150px';
                img.style.borderRadius = '12px';
                item.appendChild(img);
            } else if (msg.fileType === 'video') {
                const video = document.createElement('video');
                video.src = msg.url;
                video.controls = true;
                video.style.maxWidth = '200px';
                video.style.maxHeight = '150px';
                video.style.borderRadius = '12px';
                item.appendChild(video);
            } else {
                const link = document.createElement('a');
                link.href = msg.url;
                link.textContent = '📎 Скачать файл';
                link.target = '_blank';
                item.appendChild(link);
            }
        } else {
            const textSpan = document.createElement('span');
            textSpan.textContent = msg.text;
            item.appendChild(textSpan);
        }

        messages.appendChild(item);
        window.scrollTo(0, document.body.scrollHeight);
        if (serverOffset) socket.auth.serverOffset = serverOffset;
    });
  </script>
</body>
</html>
