<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Mallard Chat</title>
  <link rel="stylesheet" href="/public/style.css">
  <link rel="icon" href="Mallard_icon.PNG">
</head>
<body>

  <!-- КОНТЕКСТНОЕ МЕНЮ -->
  <div id="ctx-overlay"></div>
  <div id="ctx-menu">
    <div class="ctx-reactions">
      <button class="ctx-reaction" data-emoji="👍">👍</button>
      <button class="ctx-reaction" data-emoji="❤️">❤️</button>
      <button class="ctx-reaction" data-emoji="😂">😂</button>
      <button class="ctx-reaction" data-emoji="😮">😮</button>
      <button class="ctx-reaction" data-emoji="😢">😢</button>
      <button class="ctx-reaction" data-emoji="🔥">🔥</button>
    </div>
    <button class="ctx-item" id="ctx-reply"><span class="ctx-item-icon">↩️</span><span>Ответить</span></button>
    <button class="ctx-item" id="ctx-forward"><span class="ctx-item-icon">➡️</span><span>Переслать</span></button>
    <button class="ctx-item" id="ctx-copy"><span class="ctx-item-icon">📋</span><span>Копировать</span></button>
    <div class="ctx-divider"></div>
    <button class="ctx-item danger" id="ctx-delete" style="display:none"><span class="ctx-item-icon">🗑️</span><span>Удалить</span></button>
    <button class="ctx-item danger" id="ctx-ban" style="display:none"><span class="ctx-item-icon">🔨</span><span>Забанить</span></button>
  </div>

  <!-- REPLY BAR -->
  <div id="reply-bar"></div>

  <!-- TOAST -->
  <div id="ctx-toast"></div>

  <!-- ЛАЙТБОКС -->
  <div id="lightbox">
    <div id="lightbox-backdrop"></div>
    <div id="lightbox-content">
      <button id="lightbox-close">✕</button>
      <img id="lightbox-img" src="" alt="">
      <video id="lightbox-video" controls></video>
    </div>
  </div>

  <!-- ПРОФИЛЬ ОВЕРЛЕЙ -->
  <div id="profile-overlay" class="hidden"></div>

  <!-- ПРОФИЛЬ ПАНЕЛЬ -->
  <div id="profile-panel" class="hidden">
    <div class="profile-panel-header">
      <button id="profile-close-btn" class="pp-close">✕</button>
      <span class="pp-title">Профиль</span>
    </div>

    <div class="profile-avatar-section">
      <div id="profile-avatar-preview" class="profile-avatar-big">
        <span id="profile-avatar-letter">?</span>
        <img id="profile-avatar-img" src="" alt="" style="display:none">
      </div>
      <button id="profile-avatar-upload-btn" class="btn-secondary">📷 Сменить аватар</button>
      <input type="file" id="profile-avatar-file" accept="image/*" style="display:none">
    </div>

    <div class="profile-section">
      <label class="profile-label">Отображаемое имя</label>
      <input id="profile-nickname-input" class="profile-input" placeholder="Введи никнейм..." maxlength="24">
    </div>

    <div class="profile-section">
      <label class="profile-label">Стиль никнейма</label>
      <div id="nick-style-list" class="nick-style-list">
        <div class="nick-style-item" data-style="plain"><span class="nick-preview" style="color:#e8eaed;font-weight:600">Обычный</span><span class="nsi-check">✓</span></div>
        <div class="nick-style-item" data-style="gradient-fire"><span class="nick-preview nick-gradient-fire">Огонь 🔥</span><span class="nsi-check">✓</span></div>
        <div class="nick-style-item" data-style="gradient-ocean"><span class="nick-preview nick-gradient-ocean">Океан 🌊</span><span class="nsi-check">✓</span></div>
        <div class="nick-style-item" data-style="gradient-aurora"><span class="nick-preview nick-gradient-aurora">Аврора 🌌</span><span class="nsi-check">✓</span></div>
        <div class="nick-style-item" data-style="gradient-gold"><span class="nick-preview nick-gradient-gold">Золото ✨</span><span class="nsi-check">✓</span></div>
        <div class="nick-style-item" data-style="gradient-neon"><span class="nick-preview nick-gradient-neon">Неон 💜</span><span class="nsi-check">✓</span></div>
        <div class="nick-style-item" data-style="gradient-candy"><span class="nick-preview nick-gradient-candy">Конфетка 🍬</span><span class="nsi-check">✓</span></div>
        <div class="nick-style-item" data-style="shimmer"><span class="nick-preview nick-shimmer">Перелив ✨</span><span class="nsi-check">✓</span></div>
        <div class="nick-style-item" data-style="rainbow"><span class="nick-preview nick-rainbow">Радуга 🌈</span><span class="nsi-check">✓</span></div>
        <div class="nick-style-item" data-style="glitch"><span class="nick-preview nick-glitch" data-text="Глитч 👾">Глитч 👾</span><span class="nsi-check">✓</span></div>
        <div class="nick-style-item" data-style="pulse-glow"><span class="nick-preview nick-pulse-glow">Свечение 🌟</span><span class="nsi-check">✓</span></div>
        <div class="nick-style-item" data-style="ice"><span class="nick-preview nick-ice">Лёд 🧊</span><span class="nsi-check">✓</span></div>
        <div class="nick-style-item" data-style="custom-gradient"><span class="nick-preview" id="custom-gradient-preview">Свой цвет 🎨</span><span class="nsi-check">✓</span></div>
      </div>
    </div>

    <div id="custom-gradient-section" class="profile-section hidden">
      <label class="profile-label">Настроить градиент</label>
      <div class="gradient-builder">
        <div class="grad-stop">
          <label>Цвет 1</label>
          <input type="color" id="grad-color1" value="#ff6b6b">
        </div>
        <div class="grad-arrow">⟶</div>
        <div class="grad-stop">
          <label>Цвет 2</label>
          <input type="color" id="grad-color2" value="#4ecdc4">
        </div>
      </div>
      <div class="grad-angle-row">
        <label>Угол: <span id="grad-angle-val">90°</span></label>
        <input type="range" id="grad-angle" min="0" max="360" value="90" class="range-slider">
      </div>
      <div id="gradient-preview-bar" class="gradient-preview-bar"></div>
    </div>

    <div class="profile-section">
      <label class="profile-label">Цвет ника (однотонный)</label>
      <div class="color-palette">
        <button class="color-swatch" data-color="#e8eaed" style="background:#e8eaed"></button>
        <button class="color-swatch" data-color="#2b9fff" style="background:#2b9fff"></button>
        <button class="color-swatch" data-color="#4caf7d" style="background:#4caf7d"></button>
        <button class="color-swatch" data-color="#ff6b6b" style="background:#ff6b6b"></button>
        <button class="color-swatch" data-color="#ffd93d" style="background:#ffd93d"></button>
        <button class="color-swatch" data-color="#c77dff" style="background:#c77dff"></button>
        <button class="color-swatch" data-color="#ff9f43" style="background:#ff9f43"></button>
        <button class="color-swatch" data-color="#fd79a8" style="background:#fd79a8"></button>
        <button class="color-swatch" data-color="#00cec9" style="background:#00cec9"></button>
        <button class="color-swatch" data-color="#a29bfe" style="background:#a29bfe"></button>
        <button class="color-swatch" data-color="#55efc4" style="background:#55efc4"></button>
        <button class="color-swatch" data-color="#fdcb6e" style="background:#fdcb6e"></button>
        <input type="color" id="custom-color-picker" class="color-swatch color-picker-swatch" value="#2b9fff" title="Свой цвет">
      </div>
    </div>

    <button id="profile-save-btn" class="btn-primary">💾 Сохранить профиль</button>
    <button id="profile-logout-btn" class="btn-logout">↩ Выйти из аккаунта</button>
  </div>

  <!-- ШАПКА -->
  <div id="header">
    <div id="header-avatar"><img src="Mallard_icon.png"></div>
    <div id="header-info">
      <div id="header-title">Mallard Chat</div>
      <div id="header-status">онлайн</div>
    </div>
    <button id="profile-btn" title="Профиль" class="header-profile-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
    </button>
    <button id="admin-btn" title="Админ-панель" class="header-profile-btn" style="display:none">🛡️</button>
  </div>

  <!-- СООБЩЕНИЯ -->
  <ul id="messages"></ul>

  <!-- ТУЛБАР ФОРМАТИРОВАНИЯ -->
  <div id="format-toolbar" class="hidden">
    <button class="fmt-btn" data-fmt="bold" title="Жирный (Ctrl+B)"><b>B</b></button>
    <button class="fmt-btn" data-fmt="italic" title="Курсив (Ctrl+I)"><i>I</i></button>
    <button class="fmt-btn" data-fmt="underline" title="Подчёркнутый"><u>U</u></button>
    <button class="fmt-btn" data-fmt="strike" title="Зачёркнутый"><s>S</s></button>
    <button class="fmt-btn" data-fmt="code" title="Код"><span class="fmt-code">⟨/⟩</span></button>
    <button class="fmt-btn" data-fmt="spoiler" title="Спойлер"><span class="fmt-spoiler">👁</span></button>
    <button class="fmt-btn fmt-link" data-fmt="link" title="Ссылка">🔗</button>
  </div>

  <!-- ФОРМА -->
  <div id="form-wrapper">
    <input type="file" id="fileInput" accept="image/*,video/*,image/gif" multiple style="display:none;">
    <div id="attach-preview-bar"></div>
    <div id="form-inner">
      <button type="button" id="attachBtn" title="Прикрепить файл">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
        </svg>
      </button>
      <div id="input-wrapper">
        <div id="input" contenteditable="true" data-placeholder="Сообщение..."></div>
      </div>
      <button type="button" id="sendBtn" title="Отправить">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // Оборачиваем инициализацию в async IIFE для серверной проверки токена
    (async () => {
    const token = localStorage.getItem('mallard_token');
    const savedUsername = localStorage.getItem('mallard_username');

    // Если нет токена/имени — сразу на логин
    if (!token || !savedUsername) {
      window.location.href = '/login.html';
      return;
    }

    // Проверяем токен на сервере (защищает от перезапуска — старые токены инвалидируются)
    try {
      const verifyRes = await fetch('/api/verify-token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token })
      });
      if (!verifyRes.ok) {
        localStorage.removeItem('mallard_token');
        localStorage.removeItem('mallard_username');
        window.location.href = '/login.html';
        return;
      }
    } catch (e) {
      // Сервер недоступен — не блокируем загрузку (продолжаем)
    }

    let username = savedUsername;
    let counter = 0;
    let isAdmin = false; // обновится после подключения
    const renderedIds = new Set(); // для дедупликации сообщений по serverOffset
    const msgMap = new Map(); // messageId -> li element

    // ── Selection mode — объявляем заранее, используется в addMessage ──
    let selectionModeActive = false;

    // ========== ПРОФИЛЬ ==========
    let profile = JSON.parse(localStorage.getItem('mallard_profile') || '{}');
    profile.displayName  = profile.displayName  || username;
    profile.nickStyle    = profile.nickStyle    || 'plain';
    profile.nickColor    = profile.nickColor    || '#2b9fff';
    profile.avatar       = profile.avatar       || null;
    profile.gradColor1   = profile.gradColor1   || '#ff6b6b';
    profile.gradColor2   = profile.gradColor2   || '#4ecdc4';
    profile.gradAngle    = profile.gradAngle    !== undefined ? profile.gradAngle : 90;

    function saveProfile() {
      localStorage.setItem('mallard_profile', JSON.stringify(profile));
    }

    function getNickHTML(uname, prf) {
      const style = (prf && prf.nickStyle) || 'plain';
      const color = (prf && prf.nickColor) || '#2b9fff';
      const dn    = (prf && prf.displayName) || uname;

      const gradClasses = {
        'gradient-fire':  'nick-gradient-fire',
        'gradient-ocean': 'nick-gradient-ocean',
        'gradient-aurora':'nick-gradient-aurora',
        'gradient-gold':  'nick-gradient-gold',
        'gradient-neon':  'nick-gradient-neon',
        'gradient-candy': 'nick-gradient-candy',
        'shimmer':        'nick-shimmer',
        'rainbow':        'nick-rainbow',
        'glitch':         'nick-glitch',
        'pulse-glow':     'nick-pulse-glow',
        'ice':            'nick-ice',
      };

      let cls = gradClasses[style] || '';
      let extraStyle = '';
      let extraAttr = '';

      if (style === 'plain') {
        extraStyle = `color:${color}`;
      } else if (style === 'custom-gradient') {
        const c1  = (prf && prf.gradColor1) || '#ff6b6b';
        const c2  = (prf && prf.gradColor2) || '#4ecdc4';
        const ang = (prf && prf.gradAngle  !== undefined) ? prf.gradAngle : 90;
        extraStyle = `background:linear-gradient(${ang}deg,${c1},${c2});-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:700`;
      }
      if (style === 'glitch') extraAttr = `data-text="${dn}"`;

      return `<span class="message-username ${cls}" style="${extraStyle}" ${extraAttr}>${dn}</span>`;
    }

    function getAvatarHTML(prf, uname) {
      const av     = prf && prf.avatar;
      const letter = ((prf && prf.displayName) || uname || '?')[0].toUpperCase();
      if (av) return `<div class="msg-avatar"><img src="${av}" alt=""></div>`;
      return `<div class="msg-avatar msg-avatar-letter">${letter}</div>`;
    }

    // ========== SOCKET ==========
    const socket = io({ auth: { token, serverOffset: 0 }, ackTimeout: 10000, retries: 3 });

    const inputEl      = document.getElementById('input');
    const messages     = document.getElementById('messages');
    const sendBtn      = document.getElementById('sendBtn');
    const attachBtn    = document.getElementById('attachBtn');
    const fileInput    = document.getElementById('fileInput');
    const formatToolbar= document.getElementById('format-toolbar');

    // ========== ЛАЙТБОКС ==========
    const lightbox = document.getElementById('lightbox');
    const lightboxImg  = document.getElementById('lightbox-img');
    const lightboxVideo= document.getElementById('lightbox-video');

    function openLightbox(type, src) {
      if (type === 'image') {
        lightboxImg.src = src; lightboxImg.style.display = 'block';
        lightboxVideo.style.display = 'none'; lightboxVideo.pause(); lightboxVideo.src = '';
      } else {
        lightboxVideo.src = src; lightboxVideo.style.display = 'block';
        lightboxImg.style.display = 'none'; lightboxImg.src = '';
      }
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
      lightboxVideo.pause();
      setTimeout(() => { lightboxImg.src = ''; lightboxVideo.src = ''; }, 300);
    }
    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    document.getElementById('lightbox-backdrop').addEventListener('click', closeLightbox);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

    // ========== ФОРМАТИРОВАНИЕ ==========
    function wrapSelection(before, after) {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return;
      const range = sel.getRangeAt(0);
      const text = range.toString();
      if (!text) return;
      range.deleteContents();
      range.insertNode(document.createTextNode(before + text + after));
      sel.collapseToEnd();
      formatToolbar.classList.add('hidden');
    }

    function applyFormat(fmt) {
      if (fmt === 'bold')      wrapSelection('**', '**');
      if (fmt === 'italic')    wrapSelection('_', '_');
      if (fmt === 'underline') wrapSelection('__', '__');
      if (fmt === 'strike')    wrapSelection('~~', '~~');
      if (fmt === 'code')      wrapSelection('`', '`');
      if (fmt === 'spoiler')   wrapSelection('||', '||');
      if (fmt === 'link') {
        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;
        const text = sel.toString();
        const url = prompt('Введи URL:', 'https://');
        if (!url) return;
        const range = sel.getRangeAt(0);
        range.deleteContents();
        range.insertNode(document.createTextNode(`[${text}](${url})`));
        sel.collapseToEnd();
        formatToolbar.classList.add('hidden');
      }
    }

    document.querySelectorAll('.fmt-btn').forEach(btn => {
      btn.addEventListener('mousedown', e => {
        e.preventDefault();
        applyFormat(btn.dataset.fmt);
      });
    });

    function checkSelection() {
      const sel = window.getSelection();
      if (sel && !sel.isCollapsed && sel.toString().length > 0) {
        positionToolbar();
        formatToolbar.classList.remove('hidden');
      } else {
        formatToolbar.classList.add('hidden');
      }
    }

    inputEl.addEventListener('mouseup', checkSelection);
    inputEl.addEventListener('keyup', checkSelection);

    document.addEventListener('mousedown', e => {
      if (!formatToolbar.contains(e.target) && !inputEl.contains(e.target)) {
        formatToolbar.classList.add('hidden');
      }
    });

    function positionToolbar() {
      const sel = window.getSelection();
      if (!sel || !sel.rangeCount) return;
      const rect = sel.getRangeAt(0).getBoundingClientRect();
      let left = rect.left + rect.width / 2 - formatToolbar.offsetWidth / 2;
      left = Math.max(8, Math.min(left, window.innerWidth - formatToolbar.offsetWidth - 8));
      formatToolbar.style.left = left + 'px';
      formatToolbar.style.top  = (rect.top - 52 + window.scrollY) + 'px';
    }

    function parseMarkdown(text) {
      if (!text) return '';
      text = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      text = text.replace(/\|\|(.+?)\|\|/g, '<span class="spoiler" onclick="this.classList.toggle(\'revealed\')"><span class="spoiler-content">$1</span></span>');
      text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      text = text.replace(/__(.+?)__/g,     '<u>$1</u>');
      text = text.replace(/_(.+?)_/g,       '<em>$1</em>');
      text = text.replace(/~~(.+?)~~/g,     '<del>$1</del>');
      text = text.replace(/`(.+?)`/g,       '<code class="inline-code">$1</code>');
      text = text.replace(/\[(.+?)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener" class="msg-link">$1</a>');
      text = text.replace(/(^|[^"(])(https?:\/\/[^\s<&]+)/g, '$1<a href="$2" target="_blank" rel="noopener" class="msg-link">$2</a>');
      text = text.replace(/\n/g, '<br>');
      return text;
    }

    // ========== ОТПРАВКА ==========
    function getMyProfile() {
      return {
        nickStyle:   profile.nickStyle,
        nickColor:   profile.nickColor,
        displayName: profile.displayName || username,
        avatar:      profile.avatar,
        gradColor1:  profile.gradColor1,
        gradColor2:  profile.gradColor2,
        gradAngle:   profile.gradAngle
      };
    }

    // ========== ФАЙЛЫ: ОЧЕРЕДЬ ==========
    // pendingFiles — массив {file, localUrl, fileType, thumbEl}
    const pendingFiles = [];
    const previewBar = document.getElementById('attach-preview-bar');

    function getFileType(file) {
      if (file.type.startsWith('image/')) return 'image';
      if (file.type.startsWith('video/')) return 'video';
      return 'file';
    }

    function addPendingFile(file) {
      const ft = getFileType(file);
      const localUrl = URL.createObjectURL(file);

      const thumb = document.createElement('div');
      thumb.className = 'attach-thumb';

      if (ft === 'image') {
        const img = document.createElement('img');
        img.src = localUrl;
        img.addEventListener('click', () => openLightbox('image', localUrl));
        thumb.appendChild(img);
      } else if (ft === 'video') {
        const vid = document.createElement('video');
        vid.src = localUrl;
        vid.muted = true;
        vid.preload = 'metadata';
        const playIcon = document.createElement('div');
        playIcon.className = 'thumb-play';
        playIcon.textContent = '▶';
        thumb.appendChild(vid);
        thumb.appendChild(playIcon);
        thumb.addEventListener('click', (e) => {
          if (!e.target.classList.contains('thumb-remove')) openLightbox('video', localUrl);
        });
      } else {
        const label = document.createElement('div');
        label.style.cssText = 'display:flex;align-items:center;justify-content:center;height:100%;font-size:28px;';
        label.textContent = '📎';
        thumb.appendChild(label);
      }

      const rmBtn = document.createElement('button');
      rmBtn.className = 'thumb-remove';
      rmBtn.textContent = '✕';
      rmBtn.title = 'Убрать';
      rmBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const idx = pendingFiles.findIndex(p => p.thumbEl === thumb);
        if (idx !== -1) {
          URL.revokeObjectURL(pendingFiles[idx].localUrl);
          pendingFiles.splice(idx, 1);
        }
        thumb.remove();
      });
      thumb.appendChild(rmBtn);

      previewBar.appendChild(thumb);
      pendingFiles.push({ file, localUrl, fileType: ft, thumbEl: thumb });
    }

    function addFilesFromList(fileList) {
      for (const file of fileList) {
        if (file.type.startsWith('image/') || file.type.startsWith('video/')) {
          addPendingFile(file);
        }
      }
    }

    // ========== ФАЙЛЫ: ЗАГРУЗКА ==========
    async function uploadFile(file) {
      const fd = new FormData();
      fd.append('file', file);
      const r = await fetch('/api/upload', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` },
        body: fd
      });
      if (!r.ok) throw new Error('Ошибка загрузки');
      return r.json();
    }

    // ========== ОТПРАВКА ==========
    async function sendAll() {
      const text = (inputEl.innerText || inputEl.textContent || '').trim();
      const hasFiles = pendingFiles.length > 0;
      if (!text && !hasFiles) return;

      sendBtn.disabled = true;
      attachBtn.disabled = true;

      try {
        // 1. Сначала текст
        if (text) {
          const clientOffset = `${socket.id}-${counter++}`;
          socket.emit('chat message', { text, username, profile: getMyProfile() }, clientOffset);
          inputEl.innerHTML = '';
        }

        // 2. Потом файлы (по очереди, чтобы не перегружать)
        const toSend = [...pendingFiles];
        pendingFiles.length = 0;
        previewBar.innerHTML = '';

        for (const { file, localUrl, fileType } of toSend) {
          try {
            const data = await uploadFile(file);
            if (data.url) {
              const clientOffset = `${socket.id}-${counter++}`;
              socket.emit('chat message', { type:'file', fileType: data.fileType, url: data.url, username, profile: getMyProfile() }, clientOffset);
            }
          } catch (err) {
            showToast('Не удалось загрузить: ' + file.name);
          }
          URL.revokeObjectURL(localUrl);
        }
      } finally {
        sendBtn.disabled = false;
        attachBtn.disabled = false;
        fileInput.value = '';
      }
    }

    sendBtn.addEventListener('click', sendAll);
    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendAll(); }
    });

    // ========== Кнопка прикрепить ==========
    attachBtn.addEventListener('click', () => { fileInput.value = ''; fileInput.click(); });

    fileInput.addEventListener('change', () => {
      addFilesFromList(Array.from(fileInput.files));
      fileInput.value = '';
    });

    // ========== CTRL+V / PASTE ==========
    document.addEventListener('paste', (e) => {
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      const fileItems = [];
      for (const item of items) {
        if (item.kind === 'file' && (item.type.startsWith('image/') || item.type.startsWith('video/'))) {
          fileItems.push(item.getAsFile());
        }
      }
      if (fileItems.length) {
        e.preventDefault();
        addFilesFromList(fileItems);
        inputEl.focus();
      }
    });

    // ========== DRAG & DROP ==========
    const formWrapper = document.getElementById('form-wrapper');
    let dragCounter = 0;

    document.addEventListener('dragenter', (e) => {
      if ([...e.dataTransfer.types].includes('Files')) {
        dragCounter++;
        formWrapper.classList.add('drag-over');
      }
    });
    document.addEventListener('dragleave', () => {
      dragCounter--;
      if (dragCounter <= 0) { dragCounter = 0; formWrapper.classList.remove('drag-over'); }
    });
    document.addEventListener('dragover', (e) => { e.preventDefault(); });
    document.addEventListener('drop', (e) => {
      e.preventDefault();
      dragCounter = 0;
      formWrapper.classList.remove('drag-over');
      if (e.dataTransfer.files.length) {
        addFilesFromList(Array.from(e.dataTransfer.files));
      }
    });

    // ========== СООБЩЕНИЯ ==========
    function addMessage(msg) {
      if (typeof msg === 'string') msg = { text: msg, username: 'System' };
      const isOwn  = msg.username === username;
      const prf    = isOwn ? getMyProfile() : (msg.profile || {});
      const item   = document.createElement('li');
      item.className = isOwn ? 'own' : 'other';

      const row = document.createElement('div');
      row.className = 'msg-row';

      // Avatar
      const avEl = document.createElement('div');
      avEl.innerHTML = getAvatarHTML(prf, msg.username);
      const avNode = avEl.firstChild;

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';

      if (!isOwn) {
        bubble.innerHTML = getNickHTML(msg.username, prf);
      }

      if (msg.type === 'file') {
        if (msg.fileType === 'image') {
          const img = document.createElement('img');
          img.src = msg.url; img.className = 'chat-media'; img.loading = 'lazy';
          img.addEventListener('click', () => openLightbox('image', msg.url));
          bubble.appendChild(img);
        } else if (msg.fileType === 'video') {
          const wrap = document.createElement('div'); wrap.className = 'video-thumb';
          const video = document.createElement('video'); video.src = msg.url; video.className = 'chat-media'; video.muted = true;
          const pi = document.createElement('div'); pi.className = 'play-icon'; pi.innerHTML = '▶';
          wrap.appendChild(video); wrap.appendChild(pi);
          wrap.addEventListener('click', () => openLightbox('video', msg.url));
          bubble.appendChild(wrap);
        } else {
          const link = document.createElement('a');
          link.href = msg.url; link.textContent = '📎 Скачать файл'; link.target = '_blank'; link.className = 'file-link';
          bubble.appendChild(link);
        }
      } else {
        const td = document.createElement('div');
        td.className = 'msg-text';
        td.innerHTML = parseMarkdown(msg.text || '');
        bubble.appendChild(td);
      }

      if (isOwn) {
        row.appendChild(bubble);
        row.appendChild(avNode);
      } else {
        row.appendChild(avNode);
        row.appendChild(bubble);
      }

      item.appendChild(row);
      messages.appendChild(item);

      // Если режим выделения активен — добавляем чекбокс новому сообщению
      if (selectionModeActive) {
        const chk = document.createElement('div');
        chk.className = 'msg-check';
        item.insertBefore(chk, item.firstChild);
      }

      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      return item;
    }

    socket.on('your role', ({ isAdmin: adminFlag, username: serverUsername }) => {
      isAdmin = !!adminFlag;
      // Сервер подтверждает username — на случай рассинхрона
      if (serverUsername) username = serverUsername;
      if (isAdmin) {
        document.getElementById('admin-btn').style.display = '';

    });

    socket.on('banned', ({ reason }) => {
      // Показываем экран бана — нельзя отправлять
      showBannedScreen(reason);
    });

    socket.on('user banned', ({ username: bannedUser }) => {
      if (bannedUser !== username) {
        showToast(`🔨 ${bannedUser} заблокирован`);
      }
      loadAdminBanList();
    });

    socket.on('user unbanned', ({ username: unbannedUser }) => {
      if (unbannedUser !== username) {
        showToast(`✅ ${unbannedUser} разблокирован`);
      } else {
        hideBannedScreen();
      }
    });

    function showBannedScreen(reason) {
      let screen = document.getElementById('banned-screen');
      if (!screen) {
        screen = document.createElement('div');
        screen.id = 'banned-screen';
        screen.innerHTML = `
          <div class="banned-box">
            <div class="banned-icon">🔨</div>
            <div class="banned-title">Аккаунт заблокирован</div>
            <div class="banned-reason" id="banned-reason-text"></div>
          </div>`;
        document.body.appendChild(screen);
      }
      document.getElementById('banned-reason-text').textContent = reason || 'Нарушение правил';
      screen.style.display = 'flex';
      // Блокируем поле ввода
      document.getElementById('input').contentEditable = 'false';
      document.getElementById('input').dataset.placeholder = '🚫 Вы заблокированы';
      document.getElementById('sendBtn').disabled = true;
      document.getElementById('attachBtn').disabled = true;

    function hideBannedScreen() {
      const screen = document.getElementById('banned-screen');
      if (screen) screen.style.display = 'none';
      document.getElementById('input').contentEditable = 'true';
      document.getElementById('input').dataset.placeholder = 'Сообщение...';

      document.getElementById('attachBtn').disabled = false;

    socket.on('chat message', (msg, serverOffset) => {
      // Дедупликация: пропускаем сообщение, если оно уже отрендерено
      if (serverOffset && renderedIds.has(serverOffset)) return;
      const li = addMessage(msg);
      if (serverOffset) {
        renderedIds.add(serverOffset);
        socket.auth.serverOffset = serverOffset;
        if (li) {
          li._serverId = serverOffset;
          li.dataset.serverId = serverOffset;
          li.setAttribute('data-server-id', serverOffset);
          if (li._ctxData) li._ctxData.serverId = serverOffset;
          msgMap.set(Number(serverOffset), li);
          // Применяем реакции если уже пришли до рендера
          if (pendingReactions.has(Number(serverOffset))) {
            renderReactions(li, pendingReactions.get(Number(serverOffset)), Number(serverOffset));
            pendingReactions.delete(Number(serverOffset));
          }
        }
      }
    });

    // ========== ПРОФИЛЬ UI ==========
    const profilePanel    = document.getElementById('profile-panel');
    const profileOverlay  = document.getElementById('profile-overlay');
    const profileBtn      = document.getElementById('profile-btn');
    const profileCloseBtn = document.getElementById('profile-close-btn');
    const profileSaveBtn  = document.getElementById('profile-save-btn');
    const profileLogoutBtn= document.getElementById('profile-logout-btn');
    const nicknameInput   = document.getElementById('profile-nickname-input');
    const avatarFile      = document.getElementById('profile-avatar-file');
    const customGradSec   = document.getElementById('custom-gradient-section');

    function openProfile() {
      nicknameInput.value = profile.displayName || username;

      selectNickStyle(profile.nickStyle || 'plain');
      document.getElementById('grad-color1').value = profile.gradColor1 || '#ff6b6b';
      document.getElementById('grad-color2').value = profile.gradColor2 || '#4ecdc4';

      document.getElementById('grad-angle-val').textContent = (profile.gradAngle || 90) + '°';

    function closeProfile() {

    profileBtn.addEventListener('click', openProfile);
    profileCloseBtn.addEventListener('click', closeProfile);
    profileOverlay.addEventListener('click', closeProfile);

    profileSaveBtn.addEventListener('click', () => {
      const newName = nicknameInput.value.trim() || username;

    document.getElementById('profile-avatar-upload-btn').addEventListener('click', () => avatarFile.click());
    avatarFile.addEventListener('change', () => {
      const file = avatarFile.files[0];

        profile.avatar = e.target.result;

    function renderProfileAvatar() {
      const img = document.getElementById('profile-avatar-img');
      const ltr = document.getElementById('profile-avatar-letter');
      if (profile.avatar) {
        img.src = profile.avatar; img.style.display = 'block'; ltr.style.display = 'none';

    function updateHeaderAvatar() {
      const ha = document.getElementById('header-avatar');

        ha.innerHTML = `<img src="${profile.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`;
      } else {
        ha.innerHTML = `<img src="https://res.cloudinary.com/daxk48fpv/image/upload/v1779207971/mallard_chat/d3wwli3izyvtdvlwrys6.png" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`;
      }
    }

    // Nick style selection
    document.querySelectorAll('.nick-style-item').forEach(item => {
      item.addEventListener('click', () => {
        const s = item.dataset.style;
        profile.nickStyle = s;
        saveProfile();
        selectNickStyle(s);
      });
    });

    function selectNickStyle(style) {
      document.querySelectorAll('.nick-style-item').forEach(el => el.classList.remove('selected'));
      const el = document.querySelector(`.nick-style-item[data-style="${style}"]`);
      if (el) el.classList.add('selected');
      if (style === 'custom-gradient') customGradSec.classList.remove('hidden');
      else customGradSec.classList.add('hidden');

    // Color swatches
    document.querySelectorAll('.color-swatch:not(.color-picker-swatch)').forEach(btn => {
      btn.addEventListener('click', () => {

      });

    document.getElementById('custom-color-picker').addEventListener('input', e => {
      profile.nickColor = e.target.value;
      saveProfile();
      if (profile.nickStyle !== 'custom-gradient') { profile.nickStyle = 'plain'; selectNickStyle('plain'); }
    });

    function highlightActiveColor() {
      document.querySelectorAll('.color-swatch').forEach(b => b.classList.remove('active'));
      const match = document.querySelector(`.color-swatch[data-color="${profile.nickColor}"]`);
      if (match) match.classList.add('active');
    }

    // Gradient builder
    function updateGradientPreview() {
      const c1  = document.getElementById('grad-color1').value;
      const c2  = document.getElementById('grad-color2').value;
      const ang = document.getElementById('grad-angle').value;
      document.getElementById('gradient-preview-bar').style.background = `linear-gradient(${ang}deg,${c1},${c2})`;
      const cgp = document.getElementById('custom-gradient-preview');
      cgp.style.cssText = `background:linear-gradient(${ang}deg,${c1},${c2});-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:700`;
    }

    document.getElementById('grad-color1').addEventListener('input', e => { profile.gradColor1 = e.target.value; saveProfile(); updateGradientPreview(); });
    document.getElementById('grad-color2').addEventListener('input', e => { profile.gradColor2 = e.target.value; saveProfile(); updateGradientPreview(); });
    document.getElementById('grad-angle').addEventListener('input', e => {
      profile.gradAngle = parseInt(e.target.value);
      document.getElementById('grad-angle-val').textContent = e.target.value + '°';
      saveProfile(); updateGradientPreview();
    });

    // Init
    updateHeaderAvatar();
    updateGradientPreview();

    // =====================================================
    // НОВОЕ: Синхронные анимации + контекстное меню
    // Не трогаем существующие функции — только добавляем
    // =====================================================

    // --- Синхронные анимации ников ---
    // Все ники с одинаковым стилем идут в фазе друг с другом
    // Глобальный момент запуска страницы (в секундах)
    const PAGE_START = performance.now() / 1000;

    // Возвращает корректный animationDelay для синхронизации с глобальным тактом
    function calcDelay(durationSec) {
      const elapsed = performance.now() / 1000 - PAGE_START;
      return -(elapsed % durationSec) + 's';
    }

    // Применяем delay сразу к конкретному элементу (до первого рендера)
    function syncOneEl(el) {
      // animationDuration из CSS уже установлена, читаем её
      const dur = parseFloat(getComputedStyle(el).animationDuration) || 3;
      el.style.animationDelay = calcDelay(dur);
    }

    // Синхронизируем ВСЕ ники на странице (для init)
    function syncAllNicks() {
      document.querySelectorAll([
        '.nick-gradient-fire','.nick-gradient-ocean','.nick-gradient-aurora',
        '.nick-gradient-gold','.nick-gradient-neon','.nick-gradient-candy',
        '.nick-shimmer','.nick-rainbow','.nick-ice','.nick-pulse-glow','.nick-glitch'
      ].join(',')).forEach(syncOneEl);
    }

    // MutationObserver: ловим новые li и сразу — синхронно — правим delay
    // НЕ через rAF чтобы браузер не успел отрисовать со старым значением
    new MutationObserver(muts => {
      muts.forEach(m => m.addedNodes.forEach(node => {
        if (node.nodeType !== 1) return;
        // Ищем ники внутри нового сообщения
        node.querySelectorAll([
          '.nick-gradient-fire','.nick-gradient-ocean','.nick-gradient-aurora',
          '.nick-gradient-gold','.nick-gradient-neon','.nick-gradient-candy',
          '.nick-shimmer','.nick-rainbow','.nick-ice','.nick-pulse-glow','.nick-glitch'
        ].join(',')).forEach(syncOneEl);
      }));
    }).observe(document.getElementById('messages'), { childList: true, subtree: true });

    syncAllNicks(); // на случай если сообщения уже есть при загрузке

    // --- Toast ---
    const _toast = document.getElementById('ctx-toast');
    let _toastT = null;
    function showToast(msg) {
      _toast.textContent = msg;
      _toast.classList.add('show');
      clearTimeout(_toastT);
      _toastT = setTimeout(() => _toast.classList.remove('show'), 2000);
    }

    // --- Всплывающий эмодзи ---
    function floatEmoji(emoji, x, y) {
      const el = document.createElement('div');
      el.className = 'emoji-float';
      el.textContent = emoji;
      el.style.left = x - 13 + 'px';
      el.style.top  = y - 13 + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 700);
    }

    // --- Reply ---
    const replyBar = document.getElementById('reply-bar');
    let replyData  = null; // { name, text }

    function openReply(name, text) {
      replyData = { name, text };
      replyBar.style.display = 'block';
      replyBar.innerHTML = `<div class="reply-preview">
        <span class="reply-preview-name">${name}</span>
        <span class="reply-preview-text">${(text||'[медиа]').slice(0,70)}</span>
        <button class="reply-cancel">✕</button>
      </div>`;
      replyBar.querySelector('.reply-cancel').onclick = closeReply;
      document.getElementById('input').focus();
    }
    function closeReply() {
      replyData = null;
      replyBar.style.display = 'none';
      replyBar.innerHTML = '';
    }

    // Перехватываем отправку для reply — добавляем цитату прямо в текст поля ввода
    // Не трогаем socket.emit, работаем через кнопку отправки
    const _inputEl = document.getElementById('input');
    const _sendBtn = document.getElementById('sendBtn');

    function injectReplyIfNeeded() {
      if (!replyData) return;
      const cur = (_inputEl.innerText || _inputEl.textContent || '').trim();
      const quote = '> ' + replyData.name + ': ' + replyData.text.slice(0, 60) + '\n';
      // Если цитата ещё не вставлена — вставляем перед текстом
      if (!cur.startsWith('>')) {
        _inputEl.textContent = quote + cur;
      }
      closeReply();
    }

    // Перехватываем клик по sendBtn — вставляем цитату перед отправкой
    _sendBtn.addEventListener('click', injectReplyIfNeeded, true); // capture=true => до оригинального

    // Перехватываем Enter
    _inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) injectReplyIfNeeded();
    }, true);

    // Показываем цитату в пузыре — перехватываем через MutationObserver
    // вместо переопределения socket, чтобы не сломать оригинальную логику
    // _replyName/_replyText хранятся в data при emit, сервер их пробросит обратно
    // Добавляем цитату когда появляется новый li с _replyName в данных
    // (для этого сервер должен поддерживать проброс — если нет, цитата
    //  добавится только локально через emit-патч)

    // --- Контекстное меню ---
    const ctxMenu = document.getElementById('ctx-menu');
    const ctxOvl  = document.getElementById('ctx-overlay');
    let ctxData   = null; // { li, username, text }
    let _lpTimer  = null;

    function openCtx(li, x, y) {
      if (_justExitedSelection) return;
      ctxData = li._ctxData;
      document.querySelectorAll('#messages > li.ctx-active')
               .forEach(el => el.classList.remove('ctx-active'));
      li.classList.add('ctx-active');

      const isOwn = ctxData && ctxData.username === username;
      const canDelete = isOwn || isAdmin;
      const canBan = isAdmin && !isOwn;
      document.getElementById('ctx-delete').style.display = canDelete ? 'flex' : 'none';
      document.getElementById('ctx-ban').style.display   = canBan   ? 'flex' : 'none';

      // Позиционирование
      ctxMenu.classList.remove('or-tr','or-bl','or-br');
      ctxMenu.style.display = 'block';
      ctxMenu.style.opacity = '0';
      const mw = ctxMenu.offsetWidth  || 210;
      const mh = ctxMenu.offsetHeight || 260;
      const vw = window.innerWidth, vh = window.innerHeight;
      let lx = x, ly = y;
      let oh = 'l', ov = 't';
      if (lx + mw > vw - 8) { lx = x - mw; oh = 'r'; }
      if (ly + mh > vh - 8) { ly = y - mh; ov = 'b'; }
      lx = Math.max(8, lx); ly = Math.max(8, ly);
      ctxMenu.style.left = lx + 'px';
      ctxMenu.style.top  = ly + 'px';
      if (oh==='r' && ov==='t') ctxMenu.classList.add('or-tr');
      if (oh==='l' && ov==='b') ctxMenu.classList.add('or-bl');
      if (oh==='r' && ov==='b') ctxMenu.classList.add('or-br');
      ctxMenu.style.opacity = '';
      requestAnimationFrame(() => {
        ctxMenu.classList.add('visible');
        ctxOvl.classList.add('visible');
      });
    }

    function closeCtx() {
      ctxMenu.classList.remove('visible');
      ctxOvl.classList.remove('visible');
      document.querySelectorAll('#messages > li.ctx-active')
               .forEach(el => el.classList.remove('ctx-active'));
      setTimeout(() => { ctxMenu.style.display = ''; }, 200);
      ctxData = null;
    }

    ctxOvl.addEventListener('click', closeCtx);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCtx(); });

    // Вешаем слушатели на новые li через MutationObserver
    function attachCtx(li) {
      // ПК: правая кнопка → контекстное меню
      li.addEventListener('contextmenu', e => {
        e.preventDefault();
        if (selectionModeActive) return;
        openCtx(li, e.clientX, e.clientY);
      });

      // Touch: одиночный тап → ctx меню, двойной тап → ❤️, longpress 400мс → selection mode
      // Используем touch events (не pointer) — они не отменяются браузером через pointercancel
      let _tapTimer     = null;
      let _lpTouchTimer = null;
      let _tapCount     = 0;
      let _tapX         = 0;
      let _tapY         = 0;
      let _tapMoved     = false;
      let _lpFired      = false;

      li.addEventListener('touchstart', e => {
        const t = e.touches[0];
        _tapMoved = false;
        _lpFired  = false;
        _tapX = t.clientX;
        _tapY = t.clientY;

        clearTimeout(_lpTouchTimer);
        _lpTouchTimer = setTimeout(() => {
          _lpFired = true;
          clearTimeout(_tapTimer);
          _tapCount = 0;
          if (!selectionModeActive) {
            enterSelectionMode();
            // Не включаем isDraggingSelect — палец ещё прижат,
            // drag сработает только если пользователь специально потянет после отпускания.
            // Просто выделяем сообщение сразу при зажатии.
            setSelected(li, true);
            updateDeleteBar();
            if (navigator.vibrate) navigator.vibrate(40);
          }
        }, 400);
      }, { passive: true });

      li.addEventListener('touchmove', e => {
        const t = e.touches[0];
        if (Math.hypot(t.clientX - _tapX, t.clientY - _tapY) > 10) {
          _tapMoved = true;
          clearTimeout(_lpTouchTimer);
        }
      }, { passive: true });

      li.addEventListener('touchend', e => {
        clearTimeout(_lpTouchTimer);

        if (_lpFired) return; // longpress сработал — drag-to-select рулит

        if (_tapMoved) { _tapCount = 0; return; }

        if (selectionModeActive) return; // тап в selectionMode → toggle через messages.pointerup

        const touch = e.changedTouches[0];
        _tapCount++;

        if (_tapCount === 2) {
          clearTimeout(_tapTimer);
          _tapCount = 0;
          const sid = li._serverId || li.dataset.serverId;
          if (sid) {
            socket.emit('add reaction', { messageId: sid, emoji: '\u2764\uFE0F' });
            const r = li.getBoundingClientRect();
            floatEmoji('\u2764\uFE0F', r.left + r.width / 2, r.top + r.height / 2);
          }
          return;
        }

        _tapTimer = setTimeout(() => {
          _tapCount = 0;
          if (selectionModeActive) return;
          openCtx(li, touch.clientX, touch.clientY);
        }, 220);
      }, { passive: true });

      li.addEventListener('touchcancel', () => {
        clearTimeout(_lpTouchTimer);
        _tapCount = 0;
        _lpFired  = false;
      }, { passive: true });

      // ПК: longpress для ctx меню (мышь)
      li.addEventListener('pointerdown', e => {
        if (e.pointerType === 'touch') return;
        if (selectionModeActive) return;
        if (e.button !== 0) return;
        _lpTimer = setTimeout(() => {
          if (selectionModeActive) return;
          if (navigator.vibrate) navigator.vibrate(35);
          openCtx(li, e.clientX, e.clientY);
        }, 520);
      });
      li.addEventListener('pointerup',    e => { if (e.pointerType !== 'touch') clearTimeout(_lpTimer); });
      li.addEventListener('pointermove',  e => { if (e.pointerType !== 'touch') clearTimeout(_lpTimer); });
      li.addEventListener('pointercancel',e => { if (e.pointerType !== 'touch') clearTimeout(_lpTimer); });
    }

    new MutationObserver(muts => {
      muts.forEach(m => m.addedNodes.forEach(node => {
        if (node.tagName === 'LI') {
          // Извлекаем данные из пузыря
          const bubble  = node.querySelector('.msg-bubble');
          const textEl  = node.querySelector('.msg-text');
          const nickEl  = node.querySelector('.message-username');
          const isOwn   = node.classList.contains('own');
          node._ctxData = {
            li:       node,
            username: isOwn ? username : (nickEl ? nickEl.textContent : ''),
            text:     textEl ? textEl.innerText : ''
          };
          attachCtx(node);
        }
      }));
    }).observe(document.getElementById('messages'), { childList: true });

    // Реакции
    document.querySelectorAll('.ctx-reaction').forEach(btn => {
      btn.addEventListener('click', e => {
        const emoji = btn.dataset.emoji;
        // Берём serverId из ctxData или напрямую из атрибута li
        const serverId = (ctxData && ctxData.serverId)
          || (ctxData && ctxData.li && ctxData.li.dataset.serverId)
          || (ctxData && ctxData.li && ctxData.li._serverId);
        if (!serverId) {
          showToast('Не удалось поставить реакцию');
          closeCtx();
          return;
        }
        const r = btn.getBoundingClientRect();
        floatEmoji(emoji, r.left + r.width/2, r.top);
        socket.emit('add reaction', { messageId: serverId, emoji });
        closeCtx();
      });
    });

    // Очередь реакций которые пришли до рендера сообщения
    const pendingReactions = new Map();

    // Обновление реакций от сервера
    socket.on('reactions updated', ({ messageId, reactions }) => {
      const mid = Number(messageId);
      const li = msgMap.get(mid) || document.querySelector(`li[data-server-id="${mid}"]`);
      if (!li) {
        // Сообщение ещё не отрендерено — сохраняем на потом
        pendingReactions.set(mid, reactions);
        return;
      }
      renderReactions(li, reactions, mid);
    });

    function renderReactions(li, reactions, messageId) {
      let bar = li.querySelector('.msg-reactions');
      if (!bar) {
        bar = document.createElement('div');
        bar.className = 'msg-reactions';
        li.appendChild(bar);
      }
      bar.innerHTML = '';
      if (!reactions || reactions.length === 0) {
        bar.remove();
        return;
      }
      reactions.forEach(r => {
        const chip = document.createElement('button');
        chip.className = 'reaction-chip';
        const iMine = Array.isArray(r.users) && r.users.includes(username);
        if (iMine) chip.classList.add('mine');
        chip.title = Array.isArray(r.users) ? r.users.join(', ') : '';
        chip.innerHTML = `<span class="reaction-emoji">${r.emoji}</span><span class="reaction-count">${Number(r.count)}</span>`;
        chip.addEventListener('click', () => {
          socket.emit('add reaction', { messageId, emoji: r.emoji });
        });
        bar.appendChild(chip);
      });
    }

    // Ответить
    document.getElementById('ctx-reply').addEventListener('click', () => {
      if (!ctxData) return;
      openReply(ctxData.username, ctxData.text);
      closeCtx();
    });

    // Переслать — вставляем текст как цитату в поле
    document.getElementById('ctx-forward').addEventListener('click', () => {
      if (!ctxData) return;
      const inp = document.getElementById('input');
      inp.textContent = '> ' + ctxData.username + ': ' + (ctxData.text||'').slice(0,80) + '\n';
      const range = document.createRange();
      range.selectNodeContents(inp); range.collapse(false);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      inp.focus();
      showToast('Вставлено для пересылки');
      closeCtx();
    });

    // Копировать
    document.getElementById('ctx-copy').addEventListener('click', () => {
      if (!ctxData) return;
      const t = ctxData.text;
      if (!t) return closeCtx();
      navigator.clipboard.writeText(t).then(() => showToast('✓ Скопировано'))
        .catch(() => { /* fallback */ showToast('✓ Скопировано'); });
      closeCtx();
    });

    // ========== УДАЛЕНО ДРУГИМИ / СЕРВЕРОМ ==========
    socket.on('messages deleted', (ids) => {
      ids.forEach(id => {
        renderedIds.delete(id);
        const li = document.querySelector(`#messages > li[data-server-id="${id}"]`);
        if (li) animateRemoveLi(li);
      });
    });

    function animateRemoveLi(li) {
      if (li._removing) return;
      li._removing = true;
      li.style.transition = 'transform 0.22s ease, opacity 0.22s ease, max-height 0.28s ease, margin 0.28s ease';
      li.style.overflow = 'hidden';
      li.style.maxHeight = li.offsetHeight + 'px';
      requestAnimationFrame(() => {
        li.style.transform  = 'scale(0.88)';
        li.style.opacity    = '0';
        li.style.maxHeight  = '0';
        li.style.marginTop  = '0';
      });
      setTimeout(() => li.remove(), 300);
    }

    // ========== DRAG-TO-SELECT ==========
    //
    // Логика:
    // • Зажал 420мс на сообщении → входишь в selectionMode, вибрация, первое сообщение выделено
    // • Не отпуская, ведёшь пальцем/мышью → диапазон выделяется
    // • Отпустил → если выделено ≥1 — показываем панель удаления
    // • В selectionMode одиночный тап по сообщению → toggle выделения
    // • Тап вне сообщений / Escape → exitSelectionMode
    // • Во время drag — user-select:none на весь body, чтобы не выделялся текст/картинки

    let isDraggingSelect    = false;
    let dragStartLi         = null;
    let dragSelected        = new Set();

    // ── вспомогательные ──────────────────────────────────────────────────────

    function getLiAt(x, y) {
      // elementFromPoint не работает во время pointer capture на iOS,
      // обходим через clientY и getBoundingClientRect
      const items = Array.from(messages.querySelectorAll(':scope > li'));
      for (const li of items) {
        const r = li.getBoundingClientRect();
        if (y >= r.top && y <= r.bottom && x >= r.left && x <= r.right) return li;
      }
      return null;
    }

    function setSelected(li, on) {
      if (!li) return;
      let chk = li.querySelector('.msg-check');
      if (on) {
        li.classList.add('msg-selected');
        dragSelected.add(li);
        if (!chk) {
          chk = document.createElement('div');
          chk.className = 'msg-check';
          li.appendChild(chk);          // в конец li, позиционируем абсолютно
        }
        // небольшая задержка для анимации появления
        requestAnimationFrame(() => chk.classList.add('checked'));
      } else {
        li.classList.remove('msg-selected');
        dragSelected.delete(li);
        if (chk) chk.classList.remove('checked');
      }
    }

    function enterSelectionMode() {
      if (selectionModeActive) return;
      selectionModeActive = true;
      document.body.classList.add('selection-mode');
      document.body.style.userSelect = 'none';
      document.body.style.webkitUserSelect = 'none';
      // чекбоксы добавятся динамически через setSelected
    }

    let _justExitedSelection = false;

    function exitSelectionMode() {
      if (!selectionModeActive) return;
      selectionModeActive = false;
      _justExitedSelection = true;
      setTimeout(() => { _justExitedSelection = false; }, 350);
      isDraggingSelect    = false;
      dragStartLi         = null;
      document.body.classList.remove('selection-mode');
      document.body.style.userSelect = '';
      document.body.style.webkitUserSelect = '';
      dragSelected.forEach(li => {
        li.classList.remove('msg-selected');
        const chk = li.querySelector('.msg-check');
        if (chk) chk.remove();
      });
      dragSelected.clear();
      // убираем оставшиеся чекбоксы (не выделенных)
      messages.querySelectorAll('.msg-check').forEach(el => el.remove());
      const bar = document.getElementById('delete-selection-bar');
      if (bar) bar.style.display = 'none';
    }

    function updateDeleteBar() {
      const countEl = document.getElementById('del-bar-count');
      if (dragSelected.size === 0) {
        const bar = document.getElementById('delete-selection-bar');
        if (bar) bar.style.display = 'none';
        return;
      }
      showDeleteBar();
      if (countEl) countEl.textContent =
        `${dragSelected.size} ${dragSelected.size === 1 ? 'сообщение' : dragSelected.size < 5 ? 'сообщения' : 'сообщений'}`;
    }

    function clearAllSelected() { exitSelectionMode(); }

    // ── состояние текущего жеста ──────────────────────────────────────────────

    let _ds = {
      timer:      null,   // таймер долгого нажатия
      originX:    0,
      originY:    0,
      moved:      false,
      startLi:    null,   // li на котором начали зажим
      lastLi:     null,   // последний li под пальцем при свайпе
    };

    function _dsClear() {
      if (_ds.timer) { clearTimeout(_ds.timer); _ds.timer = null; }
    }

    // ── основные обработчики на messages ────────────────────────────────────
    // НЕ passive — нам нужно preventDefault для текста

    messages.addEventListener('pointerdown', e => {
      // Игнорируем правую/среднюю кнопку мыши
      if (e.pointerType === 'mouse' && e.button !== 0) return;

      const li = getLiAt(e.clientX, e.clientY);
      if (!li) return;

      _ds.originX = e.clientX;
      _ds.originY = e.clientY;
      _ds.moved   = false;
      _ds.startLi = li;
      _ds.lastLi  = null;

      if (selectionModeActive) {
        // В режиме выделения: начинаем трекать для свайпа
        isDraggingSelect = true;
        dragStartLi = li;
        // Сразу toggle (будет отменён если пользователь свайпнет)
        return;
      }

      // Для touch longpress обрабатывается в attachCtx (там же двойной тап и ctx меню)
      // Здесь таймер только для мыши
      if (e.pointerType === 'touch') return;
      _ds.timer = setTimeout(() => {
        _ds.timer = null;
        if (_ds.moved) return;
        enterSelectionMode();
        // Не включаем isDraggingSelect — как на touch, drag только при явном свайпе после отпускания
        setSelected(li, true);
        updateDeleteBar();
        if (navigator.vibrate) navigator.vibrate(40);
        try { messages.setPointerCapture(e.pointerId); } catch(_) {}
      }, 420);
    });

    messages.addEventListener('pointermove', e => {
      const dx = e.clientX - _ds.originX;
      const dy = e.clientY - _ds.originY;

      if (!_ds.moved && Math.hypot(dx, dy) > 10) {
        _ds.moved = true;
        // Движение до таймера — отменяем вход в режим (только вне selectionMode)
        if (!selectionModeActive) { _dsClear(); return; }
      }

      if (!isDraggingSelect) return;
      if (!selectionModeActive) return;

      // Предотвращаем скролл страницы во время drag-select
      e.preventDefault();

      const li = getLiAt(e.clientX, e.clientY);
      if (!li || !dragStartLi) return;
      if (li === _ds.lastLi) return; // не пересчитываем без нужды
      _ds.lastLi = li;

      const allLi = Array.from(messages.querySelectorAll(':scope > li'));
      const si = allLi.indexOf(dragStartLi);
      const ei = allLi.indexOf(li);
      if (si === -1 || ei === -1) return;

      const from = Math.min(si, ei), to = Math.max(si, ei);
      allLi.forEach((item, idx) => {
        const want = idx >= from && idx <= to;
        if (want && !dragSelected.has(item)) setSelected(item, true);
        else if (!want && dragSelected.has(item)) setSelected(item, false);
      });
    }, { passive: false });

    // Touch drag-select: движение пальца после longpress выделяет диапазон сообщений
    messages.addEventListener('touchmove', e => {
      if (!isDraggingSelect || !selectionModeActive) return;
      e.preventDefault();
      const t = e.touches[0];
      const dx = t.clientX - _ds.originX;
      const dy = t.clientY - _ds.originY;
      if (!_ds.moved && Math.hypot(dx, dy) > 10) _ds.moved = true;

      const li = getLiAt(t.clientX, t.clientY);
      if (!li || !dragStartLi) return;
      if (li === _ds.lastLi) return;
      _ds.lastLi = li;

      const allLi = Array.from(messages.querySelectorAll(':scope > li'));
      const si = allLi.indexOf(dragStartLi);
      const ei = allLi.indexOf(li);
      if (si === -1 || ei === -1) return;

      const from = Math.min(si, ei), to = Math.max(si, ei);
      allLi.forEach((item, idx) => {
        const want = idx >= from && idx <= to;
        if (want && !dragSelected.has(item)) setSelected(item, true);
        else if (!want && dragSelected.has(item)) setSelected(item, false);
      });
    }, { passive: false });

    // Touch end для drag-select
    messages.addEventListener('touchend', e => {
      if (!selectionModeActive) { isDraggingSelect = false; return; }
      if (isDraggingSelect && !_ds.moved) {
        const t = e.changedTouches[0];
        const li = getLiAt(t.clientX, t.clientY) || _ds.startLi;
        if (li) {
          if (dragSelected.has(li)) setSelected(li, false);
          else setSelected(li, true);
        }
      }
      isDraggingSelect = false;
      dragStartLi = null;
      if (dragSelected.size > 0) showDeleteBar();
      else exitSelectionMode();
      updateDeleteBar();
    }, { passive: true });

    messages.addEventListener('pointerup', e => {
      _dsClear();

      if (!selectionModeActive) { isDraggingSelect = false; return; }

      if (isDraggingSelect && !_ds.moved) {
        // Это таповый toggle (в selectionMode, пальцем/мышью, без движения)
        const li = getLiAt(e.clientX, e.clientY) || _ds.startLi;
        if (li) {
          if (dragSelected.has(li)) setSelected(li, false);
          else setSelected(li, true);
        }
      }

      isDraggingSelect = false;
      dragStartLi = null;

      // Показываем панель только после отпускания
      if (dragSelected.size > 0) {
        const canDelete = isAdmin || Array.from(dragSelected).some(
          li => li._ctxData && li._ctxData.username === username
        );
        if (canDelete) updateDeleteBar();
        else { showToast('Нет сообщений которые можно удалить'); exitSelectionMode(); }
      } else {
        exitSelectionMode();
      }
    });

    messages.addEventListener('pointercancel', () => {
      _dsClear();
      _ds.moved = false;
      isDraggingSelect = false;
      dragStartLi = null;
    });

    // Тап вне сообщений → выход из режима
    document.addEventListener('pointerdown', e => {
      if (!selectionModeActive) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      const inMessages = e.target.closest('#messages');
      const inBar      = e.target.closest('#delete-selection-bar');
      const inDialog   = e.target.closest('#delete-dialog-overlay');
      if (!inMessages && !inBar && !inDialog) exitSelectionMode();
    });

    // Escape — выход
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && selectionModeActive) exitSelectionMode();
    });

    // ========== ПАНЕЛЬ УДАЛЕНИЯ ВЫДЕЛЕННЫХ ==========
    function showDeleteBar() {
      let bar = document.getElementById('delete-selection-bar');
      if (!bar) {
        bar = document.createElement('div');
        bar.id = 'delete-selection-bar';
        bar.innerHTML = `<button id="del-bar-cancel">✕</button><span id="del-bar-count"></span><button id="del-bar-delete">🗑 Удалить</button>`;
        document.body.appendChild(bar);
        document.getElementById('del-bar-cancel').onclick = clearAllSelected;
        document.getElementById('del-bar-delete').onclick = () => {
          const liList = Array.from(dragSelected);
          showDeleteDialog(liList);
          exitSelectionMode();
        };
      }
      bar.style.display = 'flex';
    }

    // ========== ДИАЛОГ УДАЛЕНИЯ ==========
    function showDeleteDialog(liList) {
      // Админ может удалять любые, обычный — только свои
      const ownLi = isAdmin
        ? liList
        : liList.filter(li => li._ctxData && li._ctxData.username === username);
      if (ownLi.length === 0) { showToast('Можно удалять только свои сообщения'); return; }

      let overlay = document.getElementById('delete-dialog-overlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'delete-dialog-overlay';
        overlay.innerHTML = `
          <div id="delete-dialog">
            <div class="dd-title"></div>
            <label class="dd-option">
              <input type="radio" name="dd-scope" value="all" checked>
              <span>Удалить для всех</span>
            </label>
            <label class="dd-option">
              <input type="radio" name="dd-scope" value="me">
              <span>Удалить только у меня</span>
            </label>
            <div class="dd-btns">
              <button id="dd-cancel">Отмена</button>
              <button id="dd-confirm" class="dd-confirm-btn">Удалить</button>
            </div>
          </div>`;
        document.body.appendChild(overlay);
        overlay.addEventListener('click', e => { if (e.target === overlay) overlay.style.display = 'none'; });
        document.getElementById('dd-cancel').onclick = () => overlay.style.display = 'none';
      }

      overlay.querySelector('.dd-title').textContent =
        `Удалить ${ownLi.length > 1 ? ownLi.length + ' сообщений' : 'сообщение'}?`;
      overlay._liList = ownLi;
      overlay.style.display = 'flex';
      overlay.querySelector('input[value="all"]').checked = true;

      document.getElementById('dd-confirm').onclick = () => {
        const scope = overlay.querySelector('input[name="dd-scope"]:checked').value;
        const targets = overlay._liList;
        overlay.style.display = 'none';

        if (scope === 'all') {
          const ids = targets.map(li => li._serverId).filter(Boolean);
          if (ids.length > 0) socket.emit('delete messages', ids);
          targets.forEach(animateRemoveLi);
          showToast(`Удалено для всех`);
        } else {
          targets.forEach(animateRemoveLi);
          showToast(`Удалено только у тебя`);
        }
      };
    }

    // Удалить — одиночное из контекстного меню
    document.getElementById('ctx-delete').addEventListener('click', () => {
      if (!ctxData) return;
      const li = ctxData.li;
      closeCtx();
      showDeleteDialog([li]);
    });

    // ========== БАН ИЗ КОНТЕКСТНОГО МЕНЮ ==========
    document.getElementById('ctx-ban').addEventListener('click', () => {
      if (!ctxData || !isAdmin) return;
      const targetUser = ctxData.username;
      closeCtx();
      showBanDialog(targetUser);
    });

    function showBanDialog(targetUser) {
      let overlay = document.getElementById('ban-dialog-overlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'ban-dialog-overlay';
        overlay.innerHTML = `
          <div id="ban-dialog">
            <div class="dd-title" id="ban-dialog-title"></div>
            <div class="profile-section">
              <label class="profile-label">Причина (необязательно)</label>
              <input id="ban-reason-input" class="profile-input" placeholder="Спам, оскорбления, ...">
            </div>
            <div class="dd-btns">
              <button id="ban-cancel">Отмена</button>
              <button id="ban-confirm" class="dd-confirm-btn">🔨 Забанить</button>
            </div>
          </div>`;
        document.body.appendChild(overlay);
        overlay.addEventListener('click', e => { if (e.target === overlay) overlay.style.display = 'none'; });
        document.getElementById('ban-cancel').onclick = () => overlay.style.display = 'none';
      }
      document.getElementById('ban-dialog-title').textContent = `Забанить ${targetUser}?`;
      document.getElementById('ban-reason-input').value = '';
      overlay._targetUser = targetUser;
      overlay.style.display = 'flex';

      document.getElementById('ban-confirm').onclick = () => {
        const reason = document.getElementById('ban-reason-input').value.trim() || 'Нарушение правил';
        const targetUser = overlay._targetUser;
        overlay.style.display = 'none';
        socket.emit('admin ban', { targetUsername: targetUser, reason }, (res) => {
          if (res && res.ok) {
            showToast(`🔨 ${targetUser} заблокирован`);
            loadAdminBanList();
          } else {
            const errDetail = res && res.error ? ` (${res.error})` : '';
            showToast(`Ошибка бана${errDetail}`);
            console.error('Ban failed:', res);
          }
        });
      };
    }

    // ========== АДМИН-ПАНЕЛЬ ==========
    document.getElementById('admin-btn').addEventListener('click', () => {
      openAdminPanel();
    });

    // ========== АДМИН-ПАНЕЛЬ ==========
    let _allBans = []; // кэш для поиска

    function openAdminPanel() {
      let panel = document.getElementById('admin-panel-overlay');
      if (!panel) {
        panel = document.createElement('div');
        panel.id = 'admin-panel-overlay';
        panel.innerHTML = `
          <div id="admin-panel">
            <div class="profile-panel-header">
              <button id="admin-panel-close" class="pp-close">✕</button>
              <span class="pp-title">🛡️ Админ-панель</span>
            </div>

            <div class="admin-section-title">Забанить пользователя</div>
            <div class="admin-ban-row">
              <input id="admin-ban-input" class="profile-input" placeholder="Никнейм...">
              <button id="admin-ban-btn" class="dd-confirm-btn" style="white-space:nowrap;padding:8px 16px">🔨 Бан</button>
            </div>

            <div class="admin-section-title" style="margin-top:20px">
              Список банов
              <span id="admin-ban-count" class="admin-ban-count"></span>
            </div>
            <div class="admin-search-row">
              <input id="admin-search-input" class="profile-input" placeholder="🔍 Поиск по нику...">
              <button id="admin-refresh-btn" class="admin-refresh-btn" title="Обновить">↻</button>
            </div>
            <div id="admin-ban-list"><div class="admin-loading">Загрузка...</div></div>
          </div>`;
        document.body.appendChild(panel);

        document.getElementById('admin-panel-close').onclick = () => panel.style.display = 'none';
        panel.addEventListener('click', e => { if (e.target === panel) panel.style.display = 'none'; });

        document.getElementById('admin-ban-btn').onclick = () => {
          const target = document.getElementById('admin-ban-input').value.trim();
          if (!target) { document.getElementById('admin-ban-input').focus(); return; }
          showBanDialog(target);
          document.getElementById('admin-ban-input').value = '';
        };

        document.getElementById('admin-ban-input').addEventListener('keydown', e => {
          if (e.key === 'Enter') document.getElementById('admin-ban-btn').click();
        });

        document.getElementById('admin-search-input').addEventListener('input', e => {
          renderBanList(_allBans, e.target.value.trim().toLowerCase());
        });

        document.getElementById('admin-refresh-btn').addEventListener('click', () => {
          loadAdminBanList();
        });
      }

      panel.style.display = 'flex';
      loadAdminBanList();
    }

    function loadAdminBanList() {
      const listEl = document.getElementById('admin-ban-list');
      const refreshBtn = document.getElementById('admin-refresh-btn');
      if (!listEl) return;
      listEl.innerHTML = '<div class="admin-loading">Загрузка...</div>';
      if (refreshBtn) { refreshBtn.classList.add('spinning'); }

      socket.emit('admin get bans', (res) => {
        if (refreshBtn) refreshBtn.classList.remove('spinning');
        if (!res || !res.ok) {
          listEl.innerHTML = '<div class="admin-empty">Ошибка загрузки. Попробуй обновить.</div>';
          return;
        }
        _allBans = res.bans || [];
        const searchVal = (document.getElementById('admin-search-input') || {}).value || '';
        renderBanList(_allBans, searchVal.trim().toLowerCase());
        const countEl = document.getElementById('admin-ban-count');
        if (countEl) countEl.textContent = _allBans.length > 0 ? `(${_allBans.length})` : '';
      });
    }

    function renderBanList(bans, search) {
      const listEl = document.getElementById('admin-ban-list');
      if (!listEl) return;

      const filtered = search
        ? bans.filter(b => b.username.toLowerCase().includes(search) || (b.reason||'').toLowerCase().includes(search))
        : bans;

      if (filtered.length === 0) {
        listEl.innerHTML = search
          ? `<div class="admin-empty">Ничего не найдено по «${search}»</div>`
          : '<div class="admin-empty">Нет заблокированных пользователей 🎉</div>';
        return;
      }

      listEl.innerHTML = filtered.map(ban => {
        const date = ban.banned_at ? new Date(ban.banned_at * 1000).toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit', year:'2-digit' }) : '';
        return `
          <div class="admin-ban-item">
            <div class="admin-ban-info">
              <span class="admin-ban-user">🔨 ${ban.username}</span>
              <span class="admin-ban-detail">${ban.reason || '—'} · ${ban.banned_by}${date ? ' · ' + date : ''}</span>
            </div>
            <button class="admin-unban-btn" data-user="${ban.username}">Разбанить</button>
          </div>`;
      }).join('');

      listEl.querySelectorAll('.admin-unban-btn').forEach(btn => {
        btn.onclick = () => {
          const target = btn.dataset.user;
          btn.textContent = '...';
          btn.disabled = true;
          socket.emit('admin unban', { targetUsername: target }, (res) => {
            if (res && res.ok) {
              showToast(`✅ ${target} разблокирован`);
              loadAdminBanList();
            } else {
              showToast('Ошибка разбана');
              btn.textContent = 'Разбанить';
              btn.disabled = false;
            }
          });
        };
      });
    }

    })(); // конец async IIFE для проверки токена
  </script>
</body>
</html>
