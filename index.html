<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Mallard Chat</title>
  <link rel="stylesheet" href="/public/style.css">
</head>
<body>
  <ul id="messages"></ul>
  <form id="form" action="">
    <input id="input" autocomplete="off" placeholder="Напиши что-нибудь..."/>
    <input type="file" id="fileInput" accept="image/*,video/*,image/gif" style="display: none;">
    <button type="button" id="attachBtn">📎</button>
    <button type="submit">Send</button>
  </form>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    // ========== ПРОВЕРКА АВТОРИЗАЦИИ ==========
    const token = localStorage.getItem('mallard_token');
    const savedUsername = localStorage.getItem('mallard_username');

    if (!token || !savedUsername) {
        window.location.href = '/login.html';
    }

    let username = savedUsername;
    let counter = 0;
      
    const socket = io({
        auth: { token: token, serverOffset: 0 },
        ackTimeout: 10000,
        retries: 3,
    });
      
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');
      
    form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (input.value) {
            const clientOffset = `${socket.id}-${counter++}`;
            socket.emit('chat message', {
                text: input.value,
                username: username
            }, clientOffset);
            input.value = '';
        }
    });

    const attachBtn = document.getElementById('attachBtn');
    const fileInput = document.getElementById('fileInput');

    attachBtn.addEventListener('click', () => {
        fileInput.click();
    });

    fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    
    // Отключаем кнопку, чтобы не было повторов
    attachBtn.disabled = true;
      
    const formData = new FormData();
    formData.append('file', file);
    formData.append('username', username);
      
    try {
        const response = await fetch('/api/upload', {
            method: 'POST',
            body: formData
        });
      
        if (!response.ok) {
            throw new Error('Ошибка загрузки');
        }
        
        const data = await response.json();
        if (data.url) {
            socket.emit('chat message', {
                type: 'file',
                fileType: data.fileType,
                url: data.url,
                username: username
            }, () => {
                console.log('Файл отправлен');
            });
        }
    } catch (err) {
        console.error('Ошибка загрузки файла:', err);
        alert('Не удалось загрузить файл');
    } finally {
        // ОЧИЩАЕМ ВСЁ
        fileInput.value = '';
        attachBtn.disabled = false;
    }
    });
      
    socket.on('chat message', (msg, serverOffset) => {
        if (serverOffset && lastMessageId === serverOffset) return;
        lastMessageId = serverOffset;

        if (typeof msg === 'string') {
            msg = { text: msg, username: 'System' };
        }
        
        const item = document.createElement('li');
        const isOwn = msg.username === username;
        item.className = isOwn ? 'own' : 'other';
        
        if (!isOwn) {
            const nameSpan = document.createElement('span');
            nameSpan.className = 'message-username';
            nameSpan.textContent = msg.username;
            item.appendChild(nameSpan);
        }
        
        if (msg.type === 'file') {
            if (msg.fileType === 'image') {
                const img = document.createElement('img');
                img.src = msg.url;
                img.style.maxWidth = '200px';
                img.style.maxHeight = '150px';
                img.style.borderRadius = '12px';
                item.appendChild(img);
            } else if (msg.fileType === 'video') {
                const video = document.createElement('video');
                video.src = msg.url;
                video.controls = true;
                video.style.maxWidth = '200px';
                video.style.maxHeight = '150px';
                video.style.borderRadius = '12px';
                item.appendChild(video);
            } else {
                const link = document.createElement('a');
                link.href = msg.url;
                link.textContent = '📎 Скачать файл';
                link.target = '_blank';
                item.appendChild(link);
            }
        } else {
            const textSpan = document.createElement('span');
            textSpan.textContent = msg.text;
            item.appendChild(textSpan);
        }
        
        messages.appendChild(item);
        window.scrollTo(0, document.body.scrollHeight);
        if (serverOffset) socket.auth.serverOffset = serverOffset;
    });
  </script>
</body>
</html>
