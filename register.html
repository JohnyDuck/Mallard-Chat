<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Mallard Chat</title>
    <link rel="icon" href="Mallard_icon.PNG">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0e1621;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .auth-container {
            background: #17212b;
            padding: 30px 25px;
            border-radius: 28px;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
        }
        h1 span { color: #2b5278; }
        input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 15px;
            background: #242f3d;
            border: none;
            border-radius: 24px;
            color: white;
            font-size: 16px;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #2b5278;
            border: none;
            border-radius: 24px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .link {
            text-align: center;
            margin-top: 15px;
            color: #6f7885;
            font-size: 14px;
        }
        .link a { color: #2b5278; text-decoration: none; }
        .error {
            background: #c62828;
            color: white;
            padding: 10px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h1>Mallard<span>Chat</span></h1>
        <div id="errorMsg" class="error" style="display: none;"></div>
        <input type="text" id="username" placeholder="Логин">
        <input type="password" id="password" placeholder="Пароль (мин 4 символа)">
        <input type="password" id="confirmPassword" placeholder="Повтори пароль">
        <button id="registerBtn">Зарегистрироваться</button>
        <div class="link">Уже есть аккаунт? <a href="/login.html">Войти</a></div>
    </div>
    <script>
        const registerBtn = document.getElementById('registerBtn');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');
        const errorDiv = document.getElementById('errorMsg');
        
        registerBtn.addEventListener('click', async () => {
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            const confirm = confirmInput.value;
            
            if (!username || !password) {
                showError('Заполни логин и пароль');
                return;
            }
            
            if (password !== confirm) {
                showError('Пароли не совпадают');
                return;
            }
            
            if (password.length < 4) {
                showError('Пароль должен быть минимум 4 символа');
                return;
            }
            
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('mallard_token', data.token);
                    localStorage.setItem('mallard_username', data.username);
                    window.location.href = '/';
                } else {
                    showError(data.error || 'Ошибка регистрации');
                }
            } catch (err) {
                showError('Ошибка соединения с сервером');
            }
        });
        
        function showError(msg) {
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
